<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="description" content="Celestial FM 106.7 — Radio Cristiana desde Campo Grande, Misiones. Una Radio con Propósito.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Celestial FM">

  <title>Celestial FM 106.7 — Campo Grande, Misiones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- FONDO DINÁMICO -->
  <div id="bg-blur"></div>
  <div id="bg-overlay"></div>

  <!-- BOTÓN INSTALAR APP (oculto por defecto) -->
  <button id="btnInstall" class="btn-install" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
    </svg>
    <span>Instalar App</span>
  </button>

  <!-- REPRODUCTOR -->
  <div class="player">
    <img src="logo.png" alt="Celestial FM" class="logo-badge" onerror="this.style.display='none'">

    <div class="station-name">Celestial FM</div>
    <div class="station-slogan">106.7 · Campo Grande, Misiones</div>

    <!-- VINILO -->
    <div class="vinyl-wrapper">
      <div class="vinyl-disc" id="vinylDisc">
        <img src="logo.png" alt="Cover" class="vinyl-cover" id="vinylCover"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%230a0a1a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22%23d4af37%22%3E✝%3C/text%3E%3C/svg%3E'">
      </div>
    </div>

    <!-- INFO CANCIÓN -->
    <div class="song-title" id="songTitle">On Line</div>
    <div class="song-artist" id="songArtist">Celestial FM 106.7</div>

    <!-- VISUALIZADOR -->
    <div class="visualizer" id="visualizer"></div>

    <!-- CONTROLES -->
    <div class="controls">
      <button class="btn btn-play" id="btnPlay" aria-label="Reproducir">
        <div class="spinner"></div>
        <svg viewBox="0 0 24 24" id="playIcon">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <div class="volume-wrap">
        <button class="btn btn-volume" id="btnVolume" aria-label="Volumen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </button>
        <div class="volume-pop" id="volumePop">
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>

    <!-- TICKER -->
    <div class="ticker-wrap">
      <div class="ticker-text" id="tickerText">Cargando versículo...</div>
    </div>

    <div class="footer-info">Una Radio con Propósito</div>
  </div>

  <!-- AUDIO OCULTO -->
  <audio id="audioPlayer" preload="none" crossorigin="anonymous">
    <source src="https://stream.zeno.fm/75fyk31hk48uv" type="audio/mpeg">
  </audio>

  <!-- SCRIPTS -->
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
